name: integration.yml

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cat > .env <<EOF
          POSTGRES_DB=visualraindrop
          POSTGRES_USER=visualraindrop_user
          POSTGRES_PASSWORD=testpassword
      
          DATABASE_NAME=visualraindrop
          DATABASE_USER=visualraindrop_user
          DATABASE_PASSWORD=testpassword
          DATABASE_HOST=postgres
          DATABASE_PORT=5432
      
          DJANGO_SECRET_KEY=test-secret-key
          DJANGO_DEBUG=False
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          DJANGO_CORS_ALLOWED_ORIGINS=http://localhost:5173
          DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:5173
      
          VITE_API_BASE=http://localhost:8000/api
      
          EMAIL_HOST=smtp.gmail.com
          EMAIL_PORT=587
          EMAIL_USE_TLS=True
          EMAIL_HOST_USER=test@example.com
          EMAIL_HOST_PASSWORD=testpassword
          DEFAULT_FROM_EMAIL=test@example.com
          CONTACT_EMAIL=test@example.com
          EOF

      - name: Backend checks
        run: |
          docker compose -f docker-compose.prod.yml build backend
          docker compose -f docker-compose.prod.yml run --rm backend python manage.py check

      - name: Frontend build test
        run: |
          docker compose -f docker-compose.prod.yml build frontend